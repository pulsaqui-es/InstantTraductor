# Glosario base de léxico de España: inglés -> español de España (ADR-0011, T022).
#
# Hy-MT2 tiene sesgo hacia el español de América («jugo», «carro», «estacionamiento»...): este glosario se
# suma al del usuario y se aplica con la plantilla *Terminology* (ver mt/hymt2.py). En S2 subió el léxico de
# España de 9/16 a 14/16.
#
# Reglas para añadir entradas:
# - Tabla [terms]: «origen en inglés» = «destino en español de España». El origen va en minúsculas.
# - El origen se busca en la frase como palabra completa, sin distinguir mayúsculas y con un plural en «s»
#   opcional («car» vale para «cars»; los plurales irregulares, como «potatoes», llevan su propia entrada).
# - Solo entran sustantivos y expresiones con un único sentido habitual en los diálogos. Un verbo o un
#   adjetivo polisémico forzaría traducciones malas (con «cool» o «drive» habría errores).
# - Sin solapes: ningún origen contiene a otro como palabra o grupo de palabras (se prueba en los tests).
# - Sin artículos en el destino (S2: con artículo en los dos lados el modelo lo duplica).
# - Nada de léxico de América en el destino (se prueba en los tests).
# - Texto propio, escrito para este proyecto; sin datos de terceros.

